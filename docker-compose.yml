services:
  db:
    image: postgres:16
    container_name: signal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal
    ports:
      - "5433:5432"
    volumes:
      - signal_postgres_data:/var/lib/postgresql/data

volumes:
  signal_postgres_data: